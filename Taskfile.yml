version: '3'

vars:
  # Shared config reader, inlined into any task that needs exclusion logic.
  # Parses config.yml without requiring yq: reads the `exclude:` block's
  # `skills:`/`agents:` list items and the `platforms:` booleans.
  CONFIG_READER: |
    _cfg_check_syntax() {
      # Inline lists (skills: [a, b]) are valid YAML but not supported by the
      # block-form reader below -- fail loudly instead of silently ignoring.
      [ -f config.yml ] || return 0
      if grep -Eq '^[[:space:]]+(skills|agents):[[:space:]]*\[' config.yml; then
        echo "ERR config.yml uses inline list syntax (skills: [a, b]); use block form:" >&2
        echo "      skills:" >&2
        echo "        - a" >&2
        return 1
      fi
      return 0
    }
    _cfg_list() {
      # $1 = section key under exclude: (skills|agents)
      [ -f config.yml ] || return 0
      _cfg_check_syntax || exit 1
      awk -v want="$1" '
        /^[^[:space:]#]/ { top=$1; sub(":.*","",top); inex=(top=="exclude"); next }
        !inex { next }
        /^[[:space:]]+[a-z]+:[[:space:]]*$/ { key=$1; sub(":","",key); cur=key; next }
        /^[[:space:]]+-[[:space:]]*/ {
          if (cur != want) next
          line=$0
          sub(/^[[:space:]]*-[[:space:]]*/, "", line)
          sub(/[[:space:]]*#.*$/, "", line)
          gsub(/^["'"'"']|["'"'"']$/, "", line)
          if (line != "") print line
        }
      ' config.yml
    }
    excluded_names() {
      { _cfg_list skills; _cfg_list agents; } | sed '/^[[:space:]]*$/d' | sort -u
    }
    is_excluded() {
      # $1 = name, $2 = kind (skills|agents)
      local n
      for n in $(_cfg_list "$2"); do
        [ "$n" = "$1" ] && return 0
      done
      return 1
    }
    platform_enabled() {
      # $1 = claude|gemini -- true unless config.yml sets it false
      [ -f config.yml ] || return 0
      awk -v want="$1" '
        /^[^[:space:]#]/ { top=$1; sub(":.*","",top); inp=(top=="platforms"); next }
        !inp { next }
        {
          line=$0
          sub(/[[:space:]]*#.*$/, "", line)
          if (match(line, "^[[:space:]]+" want ":")) {
            val=line; sub("^[[:space:]]+" want ":[[:space:]]*", "", val)
            gsub(/[[:space:]]/, "", val)
            if (val == "false") exit 1
          }
        }
      ' config.yml
    }
    statusline_enabled() {
      # true unless config.yml sets `statusline: false` at the top level
      [ -f config.yml ] || return 0
      awk '
        /^[[:space:]]*#/ { next }
        /^statusline:/ {
          val=$0
          sub(/[[:space:]]*#.*$/, "", val)
          sub(/^statusline:[[:space:]]*/, "", val)
          gsub(/[[:space:]]/, "", val)
          if (val == "false") exit 1
        }
      ' config.yml
    }

tasks:
  install:
    desc: Install skills, agents, and settings per config.yml (uninstalls first)
    silent: true
    cmds:
      - task: config:check
      - task: config:show
      - task: uninstall
      - task: install:claude
      - task: install:gemini
      - task: install:lsp
      - |
        echo "INSTALLED run 'task verify' to check"

  install:lsp:
    internal: true
    silent: true
    desc: Install the language servers the *-lsp plugins expect, when Homebrew is present
    cmds:
      - |
        # The *-lsp plugins in settings.json register a language server but never
        # install one, so each sits inert until its binary is on PATH. Homebrew
        # covers three of the four; typescript-language-server is left out because
        # its formula depends on the typescript formula, which tracks TypeScript 7
        # and no longer ships the tsserver.js the server loads -- install that one
        # from npm instead. See docs/installation.md.
        command -v brew >/dev/null 2>&1 || { echo "SKIP language servers (brew not found)"; exit 0; }
        for bin in gopls lua-language-server rust-analyzer; do
          if command -v "$bin" >/dev/null 2>&1; then
            echo "SKIP $bin (already on PATH)"
          elif brew install "$bin" >/dev/null 2>&1; then
            echo "INSTALLED $bin"
          else
            echo "ERR brew install $bin failed (run it directly to see why)"
          fi
        done

  config:check:
    internal: true
    silent: true
    desc: Fail fast on config.yml syntax the block-form reader cannot parse
    cmds:
      - |
        [ -f config.yml ] || exit 0
        if grep -Eq '^[[:space:]]+(skills|agents):[[:space:]]*\[' config.yml; then
          echo "ERR config.yml uses inline list syntax (skills: [a, b])."
          echo "    Use block form instead:"
          echo "      exclude:"
          echo "        skills:"
          echo "          - pr-review"
          exit 1
        fi

  config:show:
    internal: true
    silent: true
    desc: Print the active exclusion config
    cmds:
      - |
        {{.CONFIG_READER}}
        if [ -f config.yml ]; then
          echo "CONFIG config.yml"
        else
          echo "CONFIG none (config.yml not found -- installing everything; see config.example.yml)"
        fi
        skipped="$(excluded_names)"
        if [ -n "$skipped" ]; then
          echo "CONFIG excluding: $(echo $skipped)"
        else
          echo "CONFIG excluding: nothing"
        fi
        platform_enabled claude || echo "CONFIG platform claude: disabled"
        platform_enabled gemini || echo "CONFIG platform gemini: disabled"
        statusline_enabled || echo "CONFIG statusline: disabled"

  clean:stale:
    internal: true
    silent: true
    desc: Remove stale symlinks in ~/.claude and ~/.gemini pointing to this repo
    cmds:
      - |
        {{.CONFIG_READER}}
        repo="$(pwd)"
        # Only ever removes symlinks whose target is inside this repo -- a real file or a
        # link pointing elsewhere belongs to someone else and is left for `task doctor`.
        # Two cases qualify: the link is broken (source deleted or renamed), or it still
        # resolves but the repo no longer ships that name -- either dropped from the repo
        # or newly excluded in config.yml. Without the second case an excluded skill stays
        # live and competes at selection time despite `verify` reporting it as absent.
        remove_stale() {
          local f="$1" name="$2" kind="$3" reason
          [ -L "$f" ] || return 0
          case "$(readlink "$f")" in "$repo"/*) ;; *) return 0 ;; esac
          if [ ! -e "$f" ]; then
            reason="broken link"
          elif [ ! -d "$repo/$kind/$name" ]; then
            reason="no longer in repo"
          elif is_excluded "$name" "$kind"; then
            reason="excluded in config.yml"
          else
            return 0
          fi
          rm -f "$f"
          rmdir "$(dirname "$f")" 2>/dev/null || true
          echo "REMOVED $f ($reason)"
        }
        for dir in "$HOME/.claude/skills/"*/ "$HOME/.gemini/skills/"*/; do
          [ -d "$dir" ] || continue
          # Every *.md, not just SKILL.md: a skill may ship reference files
          # alongside it, and a renamed or deleted one leaves a broken link.
          for f in "$dir"*.md; do remove_stale "$f" "$(basename "$dir")" skills; done
          # Same for bundled scripts/ and assets/, which are mirrored file by file.
          for f in $(find "$dir" -mindepth 2 -type l 2>/dev/null); do
            remove_stale "$f" "$(basename "$dir")" skills
          done
          for sub in "$dir"scripts "$dir"assets; do
            [ -d "$sub" ] && rmdir "$sub" 2>/dev/null || true
          done
        done
        for dir in "$HOME/.claude/agents/"*/ "$HOME/.gemini/agents/"*/; do
          [ -d "$dir" ] || continue
          for f in "$dir"*.md; do remove_stale "$f" "$(basename "$dir")" agents; done
        done

  install:claude:
    internal: true
    silent: true
    desc: Symlink skills and agents, merge settings into ~/.claude
    deps: [clean:stale]
    cmds:
      - |
        {{.CONFIG_READER}}
        platform_enabled claude || { echo "SKIP claude platform (disabled in config.yml)"; exit 0; }
        for dir in skills/*/; do
          name=$(basename "$dir")
          if is_excluded "$name" skills; then echo "SKIP $name skill (excluded)"; continue; fi
          mkdir -p "$HOME/.claude/skills/$name"
          for src in "$dir"*.md; do
            ln -sf "$(pwd)/$src" "$HOME/.claude/skills/$name/$(basename "$src")"
          done
          # scripts/ and assets/ are mirrored file by file, so a skill can ship an
          # executable it reaches by ${CLAUDE_SKILL_DIR}/scripts/<name>. Linking each
          # file rather than the directory keeps clean:stale and verify able to see
          # every one of them individually, the same way they see a reference file.
          for sub in scripts assets; do
            [ -d "$dir$sub" ] || continue
            find "$dir$sub" -type f | while read -r src; do
              rel="${src#$dir}"
              mkdir -p "$HOME/.claude/skills/$name/$(dirname "$rel")"
              ln -sf "$(pwd)/$src" "$HOME/.claude/skills/$name/$rel"
            done
          done
        done
      - |
        {{.CONFIG_READER}}
        platform_enabled claude || exit 0
        # Linked before the settings merge below, so the statusLine command in
        # settings.json never points at a script that isn't there yet.
        if ! statusline_enabled; then
          echo "SKIP statusline.sh (disabled in config.yml)"
        elif [ -f "claude/statusline.sh" ]; then
          ln -sf "$(pwd)/claude/statusline.sh" "$HOME/.claude/statusline.sh"
          echo "LINKED statusline.sh"
        fi
      - |
        {{.CONFIG_READER}}
        platform_enabled claude || exit 0
        if [ -f "claude/settings.json" ]; then
          command -v jq >/dev/null 2>&1 || { echo "ERR jq is required to merge settings.json (brew install jq)"; exit 1; }
          target="$HOME/.claude/settings.json"
          # With the status line disabled the script is never linked, so the
          # statusLine key would point at a path that does not exist. Drop it
          # from the source before either branch below reads it.
          source="claude/settings.json"
          if ! statusline_enabled; then
            source="$(mktemp)"
            trap 'rm -f "$source"' EXIT
            jq 'del(.statusLine)' "claude/settings.json" > "$source" || {
              echo "ERR failed to filter statusLine out of settings.json"; exit 1; }
          fi
          if [ ! -f "$target" ] || [ -L "$target" ]; then
            rm -f "$target"
            cp "$source" "$target"
          else
            # jq writes .tmp via redirect before it can fail, so a malformed target
            # leaves an empty .tmp behind while `&&` skips the mv -- the merge is
            # silently dropped and the raw parse error is all the user sees. Check
            # the file first and clean up on failure.
            if ! jq -e . "$target" >/dev/null 2>&1; then
              echo "ERR $target is not valid JSON -- fix or remove it, then re-run"
              exit 1
            fi
            if jq -s '.[0] as $host | .[1] as $repo | ($host * $repo) | .permissions.allow = ((($host.permissions.allow // []) + ($repo.permissions.allow // [])) | unique) | .permissions.ask = ((($host.permissions.ask // []) + ($repo.permissions.ask // [])) | unique) | .permissions.deny = ((($host.permissions.deny // []) + ($repo.permissions.deny // [])) | unique)' \
              "$target" "$source" > "$target.tmp" 2>/dev/null; then
              mv "$target.tmp" "$target"
            else
              rm -f "$target.tmp"
              echo "ERR failed to merge settings into $target -- left unchanged"
              exit 1
            fi
          fi
          echo "MERGED settings.json"
        fi
      - |
        {{.CONFIG_READER}}
        platform_enabled claude || exit 0
        for dir in agents/*/; do
          [ -d "$dir" ] || continue
          name=$(basename "$dir")
          if is_excluded "$name" agents; then echo "SKIP $name agent (excluded)"; continue; fi
          mkdir -p "$HOME/.claude/agents/$name"
          ln -sf "$(pwd)/${dir}AGENT.md" "$HOME/.claude/agents/$name/AGENT.md"
          echo "LINKED $name agent"
        done

  install:gemini:
    internal: true
    silent: true
    desc: Symlink skills into ~/.gemini (agents are Claude Code only)
    deps: [clean:stale]
    cmds:
      - |
        {{.CONFIG_READER}}
        platform_enabled gemini || { echo "SKIP gemini platform (disabled in config.yml)"; exit 0; }
        for dir in skills/*/; do
          name=$(basename "$dir")
          if is_excluded "$name" skills; then continue; fi
          mkdir -p "$HOME/.gemini/skills/$name"
          for src in "$dir"*.md; do
            ln -sf "$(pwd)/$src" "$HOME/.gemini/skills/$name/$(basename "$src")"
          done
          for sub in scripts assets; do
            [ -d "$dir$sub" ] || continue
            find "$dir$sub" -type f | while read -r src; do
              rel="${src#$dir}"
              mkdir -p "$HOME/.gemini/skills/$name/$(dirname "$rel")"
              ln -sf "$(pwd)/$src" "$HOME/.gemini/skills/$name/$rel"
            done
          done
        done

  uninstall:
    silent: true
    desc: Remove all symlinks pointing to this repo and subtract repo-defined settings from ~/.claude/settings.json
    cmds:
      - |
        target="$HOME/.claude/settings.json"
        if [ -f "claude/settings.json" ] && [ -f "$target" ] && [ ! -L "$target" ]; then
          command -v jq >/dev/null 2>&1 || { echo "ERR jq is required to subtract settings.json (brew install jq)"; exit 1; }
          # A malformed target would otherwise print a raw parse error, skip the mv,
          # and strand an empty .tmp -- and since `task install` runs uninstall first,
          # that failure would be the user's first confusing sight on every install.
          if ! jq -e . "$target" >/dev/null 2>&1; then
            echo "ERR $target is not valid JSON -- fix or remove it, then re-run"
            exit 1
          fi
          if ! jq -s '
            .[0] as $host | .[1] as $repo |
            # Subtract every repo-defined permission string from all three lists, not
            # just its matching one. An entry the repo moves between lists (deny -> ask)
            # would otherwise be subtracted from its new list only, stranding the stale
            # copy in the old one -- and since deny beats ask, the move silently no-ops.
            (($repo.permissions.allow // []) + ($repo.permissions.ask // []) + ($repo.permissions.deny // []) | unique) as $defined |
            $host
            | .permissions.allow = ((.permissions.allow // []) - $defined)
            | .permissions.ask = ((.permissions.ask // []) - $defined)
            | .permissions.deny = ((.permissions.deny // []) - $defined)
            | if ($repo.permissions.defaultMode != null) and (.permissions.defaultMode == $repo.permissions.defaultMode) then del(.permissions.defaultMode) else . end
            | .env = ((.env // {}) | with_entries(select(.key as $k | ($repo.env // {}) | has($k) | not)))
            | .enabledPlugins = ((.enabledPlugins // {}) | with_entries(select(.key as $k | ($repo.enabledPlugins // {}) | has($k) | not)))
            | reduce (($repo | keys) - ["permissions", "env", "enabledPlugins"])[] as $k (.; del(.[$k]))
            | .permissions |= with_entries(select(.value != []))
            | reduce ["permissions", "env", "enabledPlugins"][] as $k (.; if .[$k] == {} then del(.[$k]) else . end)
          ' "$target" "claude/settings.json" > "$target.tmp" 2>/dev/null; then
            rm -f "$target.tmp"
            echo "ERR failed to subtract settings from $target -- left unchanged"
            exit 1
          fi
          mv "$target.tmp" "$target"
          echo "SUBTRACTED repo-defined settings from $target"
        fi
      - |
        repo="$(pwd)"
        remove_link() {
          local f="$1"
          if [ -L "$f" ]; then
            target="$(readlink "$f")"
            case "$target" in "$repo"/*) rm -f "$f"; rmdir "$(dirname "$f")" 2>/dev/null || true; echo "REMOVED $f" ;; esac
          fi
        }
        for dir in "$HOME/.claude/skills/"*/ "$HOME/.gemini/skills/"*/ "$HOME/.claude/agents/"*/ "$HOME/.gemini/agents/"*/; do
          for f in "$dir"*.md; do remove_link "$f"; done
        done
        remove_link "$HOME/.claude/statusline.sh"

  lint:md:
    desc: Lint every Markdown file in this repo against .markdownlint.jsonc
    silent: true
    cmds:
      - |
        if ! command -v npx >/dev/null 2>&1; then
          echo "ERR npx not found -- the Markdown linter needs Node.js: https://nodejs.org"
          exit 1
        fi
        # Kept out of `verify`: this is the one target that reaches the network,
        # and verify must keep working offline.
        npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  verify:
    desc: Run all verification steps (install, doctor)
    cmds:
      - task: verify:skills-installed
      # doctor last and advisory-only: leftovers are worth surfacing but must not
      # fail the build, since the user may keep unrelated skills of their own.
      - task: doctor

  doctor:
    desc: Report skills/agents installed in ~/.claude and ~/.gemini that this repo does not manage
    silent: true
    cmds:
      - |
        {{.CONFIG_READER}}
        repo="$(pwd)"
        found=0
        # An entry is repo-managed if it is a symlink pointing into this repo.
        # Anything else -- a real file, or a link elsewhere -- is reported, never
        # deleted: it may be hand-written or installed by another tool.
        report() {
          local f="$1" kind="$2" name="$3"
          [ -e "$f" ] || [ -L "$f" ] || return 0
          if [ -L "$f" ]; then
            case "$(readlink "$f")" in "$repo"/*) return 0 ;; esac
            echo "UNMANAGED $f (symlink outside this repo)"
          else
            echo "UNMANAGED $f (real file, not a symlink)"
          fi
          found=1
        }
        # Empty dirs are leftovers from an earlier layout: harmless but confusing,
        # since they look like installed skills until you look inside.
        empty_dir() {
          if [ -z "$(ls -A "$1" 2>/dev/null)" ]; then
            echo "EMPTY     $1 (leftover directory, no SKILL.md/AGENT.md)"
            found=1
            return 0
          fi
          return 1
        }
        for base in "$HOME/.claude" "$HOME/.gemini"; do
          [ -d "$base/skills" ] || continue
          for dir in "$base/skills/"*/; do
            [ -d "$dir" ] || continue
            empty_dir "$dir" && continue
            for f in "$dir"*.md; do report "$f" skills "$(basename "$dir")"; done
          done
        done
        for dir in "$HOME/.claude/agents/"*/; do
          [ -d "$dir" ] || continue
          empty_dir "$dir" && continue
          name=$(basename "$dir")
          for f in "$dir"*.md; do [ -e "$f" ] && report "$f" agents "$name"; done
        done
        if [ $found -eq 0 ]; then
          echo "OK  no unmanaged or leftover skills and agents found"
        else
          echo
          echo "NOTE this repo did not install the entries above. UNMANAGED files are"
          echo "     live and compete with repo skills at selection time; EMPTY dirs"
          echo "     are inert leftovers from an earlier layout. Remove any you no"
          echo "     longer want. Nothing was deleted."
        fi

  verify:skills-installed:
    silent: true
    desc: Verify all skills and agents are installed
    cmds:
      - |
        {{.CONFIG_READER}}
        failed=0
        check() {
          if [ -e "$1" ]; then
            echo "OK  $1"
          else
            echo "ERR $1"
            failed=1
          fi
        }
        absent() {
          # excluded items must NOT be installed
          if [ -e "$1" ]; then
            echo "ERR $1 (excluded but still installed)"
            failed=1
          else
            echo "OK  excluded: $1"
          fi
        }
        for dir in skills/*/; do
          name=$(basename "$dir")
          # Every *.md the skill ships, so a reference file that failed to link
          # is an error rather than a silent gap the skill only hits at runtime.
          # Reference files and bundled scripts/assets alike, so one that failed to
          # link is an error rather than a silent gap the skill only hits at runtime.
          for src in "$dir"*.md $(find "$dir"scripts "$dir"assets -type f 2>/dev/null); do
            [ -e "$src" ] || continue
            rel="${src#$dir}"
            if is_excluded "$name" skills; then
              absent "$HOME/.claude/skills/$name/$rel"
              absent "$HOME/.gemini/skills/$name/$rel"
              continue
            fi
            if platform_enabled claude; then check "$HOME/.claude/skills/$name/$rel"; fi
            if platform_enabled gemini; then check "$HOME/.gemini/skills/$name/$rel"; fi
          done
        done
        if platform_enabled claude 2>/dev/null && [ -f "claude/settings.json" ]; then
          if jq -e '.spinnerVerbs' "$HOME/.claude/settings.json" >/dev/null 2>&1; then
            echo "OK  $HOME/.claude/settings.json (merged)"
          else
            echo "ERR $HOME/.claude/settings.json (missing spinnerVerbs)"
            failed=1
          fi
        fi
        if platform_enabled claude 2>/dev/null && [ -f "claude/statusline.sh" ]; then
          if statusline_enabled; then
            check "$HOME/.claude/statusline.sh"
          else
            absent "$HOME/.claude/statusline.sh"
          fi
        fi
        for dir in agents/*/; do
          [ -d "$dir" ] || continue
          name=$(basename "$dir")
          if is_excluded "$name" agents; then
            absent "$HOME/.claude/agents/$name/AGENT.md"
            continue
          fi
          if platform_enabled claude; then check "$HOME/.claude/agents/$name/AGENT.md"; fi
        done
        exit $failed
