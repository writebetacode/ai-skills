# Copy to config.yml (gitignored) to customize what `task install` links.
#
# Everything in skills/ and agents/ installs by default. List the names you
# do NOT want -- a new skill added to the repo installs automatically unless
# you name it here.
#
# Names are directory names under skills/ and agents/.

exclude:
  skills:
    # - pr-review
    # - remote-issue
  agents:
    # No agents ship in this repo today; the key stays for ones you add.
    # - some-agent

# Per-platform opt-out. Set to false to skip that platform entirely.
platforms:
  claude: true
  gemini: true

# Set to false to skip the status line: statusline.sh is not linked and the
# statusLine key is dropped from the settings merge, leaving whatever your
# ~/.claude/settings.json already had.
statusline: true
